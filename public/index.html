<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>QRIS MVP Bulk Account Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 rounded shadow-sm">
        <h3 class="mb-3">Checker Rekening QRIS MVP</h3>
        <textarea id="inputData" class="form-control mb-3" rows="6" placeholder="Format: BANK_CODE, NOMOR_REKENING (1 per baris)&#10;Contoh: 165, 08577215555"></textarea>
        <button onclick="processCheck()" class="btn btn-primary">Validasi Sekarang</button>
        
        <div id="resultArea" class="mt-4"></div>
    </div>

    <script>
        async function processCheck() {
            const raw = document.getElementById('inputData').value;
            const lines = raw.split('\n');
            const accounts = [];

            lines.forEach(line => {
                const parts = line.split(',');
                if(parts.length >= 2) {
                    accounts.push({
                        bankCode: parts[0].trim(),
                        accountNumber: parts[1].trim()
                    });
                }
            });

            const res = await fetch('/api/check-accounts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accounts })
            });

            const data = await res.json();
            let html = '<table class="table table-bordered"><thead><tr><th>Bank</th><th>No Rekening</th><th>Nama Pemilik</th></tr></thead><tbody>';
            data.results.forEach(r => {
                html += `<tr><td>${r.bank}</td><td>${r.account}</td><td>${r.accountName}</td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('resultArea').innerHTML = html;
        }
    </script>
</body>
</html>
